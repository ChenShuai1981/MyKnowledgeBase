name: Daily Knowledge Collection

on:
  schedule:
    - cron: "0 8 * * *"  # UTC 08:00 = 北京时间 16:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run knowledge collection pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/pipeline.py --sources github,rss --limit 20 --verbose

      - name: Validate JSON files
        run: python hooks/validate_json.py knowledge/articles/*.json

      - name: Check quality
        run: python hooks/check_quality.py knowledge/articles/*.json

      - name: Commit and push new articles
        id: commit
        run: |
          CHANGED_FILES=$(git status --porcelain)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No new files to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            ARTICLE_COUNT=$(echo "$CHANGED_FILES" | grep -c "knowledge/articles/" || echo "0")
            TODAY=$(date +%Y-%m-%d)
            git add knowledge/
            git commit -m "docs: add ${ARTICLE_COUNT} articles from ${TODAY}"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi